<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invidious</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f0f0f; color: #f1f1f1;
    font: 24px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 4vh 5vw;
  }
  main { width: min(1100px, 100%); }
  h1 { font-size: 2.2em; margin: 0 0 .2em; }
  p { margin: .2em 0 1em; color: #aaa; }
  [hidden] { display: none !important; }
  .presets { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); margin-bottom: 32px; }
  button, input {
    font: inherit; color: inherit; background: #1c1c1c; border: 2px solid #333;
    border-radius: 12px; padding: 18px 22px; width: 100%; text-align: left;
  }
  button { cursor: pointer; }
  button:hover, input:focus, button:focus { border-color: #f1f1f1; outline: none; }
  input:focus, button:focus { box-shadow: 0 0 0 4px rgba(255,255,255,.35); }
  form { display: flex; gap: 16px; }
  form input { flex: 1; }
  form button { width: auto; white-space: nowrap; text-align: center; }
  .hint { margin-top: 28px; font-size: .8em; color: #777; }
  #loading { text-align: center; }
  .spinner {
    width: 56px; height: 56px; margin: 0 auto 20px;
    border: 6px solid #333; border-top-color: #f1f1f1; border-radius: 50%;
    animation: itv-spin 1s linear infinite;
  }
  @keyframes itv-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!-- Marks this page so the injected userscript leaves key handling to us. -->
<script>window.__invidiousPicker = true;</script>

<main>
  <h1>Invidious</h1>
  <p id="status">Choose an instance</p>

  <section id="picker">
    <div class="presets" id="presets"></div>
    <form id="custom">
      <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://invidious.example.com" aria-label="Instance URL">
      <button type="submit">Connect</button>
    </form>
    <p class="hint">Your choice is saved on this TV. To change it later, use
      “Open instance picker” in Invidious preferences.</p>
  </section>

  <div id="loading" hidden>
    <div class="spinner"></div>
    <p id="loading-text">Checking instance…</p>
  </div>
</main>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'invidious-tizen.instance';
  // Taken from https://docs.invidious.io/instances/
  var PRESETS = [
    { url: 'https://inv.nadeko.net/', flag: '🇨🇱' },
    { url: 'https://invidious.nerdvpn.de/', flag: '🇺🇦' },
    { url: 'https://yt.chocolatemoo53.com/', flag: '🇺🇸' },
    { url: 'https://invidious.tiekoetter.com/', flag: '🇩🇪' },
    { url: 'https://invidious.f5.si/', flag: '🇯🇵' }
  ];
  var statusEl = document.getElementById('status');
  var pickerEl = document.getElementById('picker');
  var loadingEl = document.getElementById('loading');
  var loadingText = document.getElementById('loading-text');
  var urlInput = document.getElementById('url');
  var pending = false;

  // True when this document was restored by the remote's Back key (an instance
  // stepped back onto the picker). Then the chooser is what the user wants, not
  // the loading state that would bounce them forward again.
  var resumed = false;
  try {
    var nav = window.performance && window.performance.navigation;
    resumed = !!(nav && nav.type === 2); // PerformanceNavigation.TYPE_BACK_FORWARD
    if (!resumed && window.performance && window.performance.getEntriesByType) {
      var navEntry = window.performance.getEntriesByType('navigation')[0];
      resumed = !!(navEntry && navEntry.type === 'back_forward');
    }
  } catch (e) { /* ignore */ }

  function normalize(value) {
    var u = (value || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u.replace(/\/+$/, '') + '/';
  }
  function saved() { try { return localStorage.getItem(STORE_KEY) || ''; } catch (e) { return ''; } }
  function save(u) { try { localStorage.setItem(STORE_KEY, u); } catch (e) { /* private mode */ } }
  function host(u) { return u.replace(/^https?:\/\//i, '').replace(/\/$/, ''); }
  // A deliberate choice uses assign, so the picker stays in history and Back
  // returns to the chooser. The automatic connect uses replace: nothing before
  // an instance is worth going back to, and Back must not stop on a loader that
  // immediately forwards to the same page.
  function go(u, replace) {
    if (replace) window.location.replace(u);
    else window.location.href = u;
  }

  function showPicker(message) {
    pending = false;
    loadingEl.hidden = true;
    pickerEl.hidden = false;
    statusEl.textContent = message || 'Choose an instance';
    if (urlInput && !urlInput.value) urlInput.value = saved();
    var first = document.querySelector('#presets button');
    if (first) { try { first.focus(); } catch (e) { /* ignore */ } }
  }

  function showLoading(label) {
    pending = true;
    pickerEl.hidden = true;
    loadingEl.hidden = false;
    loadingText.textContent = label;
  }

  // Resolves true if the instance answers, false on network failure/timeout.
  function probe(u) {
    return new Promise(function (resolve) {
      if (typeof fetch !== 'function' || typeof AbortController === 'undefined') { resolve(true); return; }
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 5000);
      fetch(u, { mode: 'no-cors', cache: 'no-store', signal: controller.signal }).then(
        function () { clearTimeout(timer); resolve(true); },
        function () { clearTimeout(timer); resolve(false); }
      );
    });
  }

  // Confirm the instance is alive, then redirect as soon as it answers.
  // `automatic` connects (nothing was chosen here) replace the picker in history.
  function connect(u, automatic) {
    showLoading('Checking ' + host(u) + '\u2026');
    probe(u).then(function (alive) {
      if (!pending) return; // cancelled
      if (alive) go(u, !!automatic);
      else showPicker("Couldn't reach " + host(u) + ". Choose an instance.");
    });
  }

  // The custom form: normalize, remember, connect. Returns false for an empty box.
  function submitCustom() {
    var u = normalize(urlInput.value);
    if (!u) return false;
    save(u);
    connect(u, false);
    return true;
  }

  // Geometric D-pad navigation. Tizen's webview does not move focus between
  // controls on its own, so the picker walks the layout itself. This mirrors
  // src/userscript/navigation.ts. The userscript skips this page entirely (see
  // isPickerPage), so everything the TV needs has to live here.
  var FOCUSABLE = 'a[href],button,input,select,textarea,[tabindex],[role="button"]';
  var INTERACTIVE = 'a[href],button,input,select,textarea,[role="button"]';
  var ARROWS = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };

  function isVisible(el) {
    var rect = el.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return false;
    var style = window.getComputedStyle(el);
    return (
      !style || (style.visibility !== 'hidden' && style.display !== 'none' && style.opacity !== '0')
    );
  }

  function centerOf(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // Primary-axis gap plus a penalty for cross-axis misalignment.
  function score(from, to, dir) {
    var dx = to.x - from.x;
    var dy = to.y - from.y;
    var EPS = 4;
    if (dir === 'left') return dx >= -EPS ? null : from.x - to.x + Math.abs(dy) * 2;
    if (dir === 'right') return dx <= EPS ? null : to.x - from.x + Math.abs(dy) * 2;
    if (dir === 'up') return dy >= -EPS ? null : from.y - to.y + Math.abs(dx) * 2;
    return dy <= EPS ? null : to.y - from.y + Math.abs(dx) * 2;
  }

  function moveFocus(dir) {
    var found = document.querySelectorAll(FOCUSABLE);
    var els = [];
    for (var i = 0; i < found.length; i++) {
      var el = found[i];
      if (el.disabled) continue;
      if (el.getAttribute('tabindex') === '-1' && !el.matches(INTERACTIVE)) continue;
      if (isVisible(el)) els.push(el);
    }
    if (!els.length) return false;

    var active = document.activeElement;
    var current = active && active !== document.body && active !== document.documentElement ? active : null;
    if (!current) { els[0].focus(); return true; }

    var origin = centerOf(current);
    var best = null;
    var bestScore = Infinity;
    for (var j = 0; j < els.length; j++) {
      if (els[j] === current) continue;
      var s = score(origin, centerOf(els[j]), dir);
      if (s !== null && s < bestScore) { bestScore = s; best = els[j]; }
    }
    if (!best) return false;
    best.focus();
    return true;
  }

  // The URL field is highlighted read-only and opens the TV keyboard on OK, the
  // same deferral the userscript uses on an instance (which never runs here).
  // Focusing an editable field on a TV either raises the keyboard at once or,
  // with a value already in it, leaves it unreachable: neither is what stepping
  // past the box with the D-pad should do.
  var PENDING = 'data-itv-edit-pending';
  var justActivated = null;

  document.addEventListener(
    'focusin',
    function (e) {
      var el = e.target;
      if (!el || el.tagName !== 'INPUT') return;
      if (justActivated === el) { justActivated = null; return; }
      if (!el.hasAttribute(PENDING)) {
        el.readOnly = true;
        el.setAttribute(PENDING, '1');
      }
    },
    true,
  );

  document.addEventListener(
    'focusout',
    function (e) {
      var el = e.target;
      if (!el || !el.hasAttribute || !el.hasAttribute(PENDING)) return;
      el.removeAttribute(PENDING);
      el.readOnly = false;
    },
    true,
  );

  // OK raises the keyboard: the field has to become editable while it takes
  // focus, and the caret has to be placed explicitly or a pre-filled value
  // leaves Tizen with nothing to show the keyboard around.
  function startEditing(el) {
    el.removeAttribute(PENDING);
    el.readOnly = false;
    justActivated = el;
    el.blur();
    el.focus();
    try {
      var end = (el.value || '').length;
      el.setSelectionRange(end, end);
    } catch (e) { /* not a text field */ }
  }

  function exitToTizenBrew() {
    try {
      if (typeof tizen !== 'undefined' && tizen && tizen.application) {
        tizen.application.getCurrentApplication().exit();
        return true;
      }
    } catch (e) { /* not on Tizen */ }
    return false;
  }

  window.addEventListener('keydown', function (e) {
    var active = document.activeElement;
    var inUrl = active && active.tagName === 'INPUT' && active.id === 'url';
    var editing = inUrl && !active.hasAttribute(PENDING);

    if (e.keyCode === 10009 || e.keyCode === 27) {
      // Back while the keyboard is up closes the keyboard; otherwise step back
      // toward TizenBrew. Already stepped back onto the chooser means there is
      // nothing left between here and TizenBrew, so exit instead of pushing
      // against the start of the history.
      if (editing) { active.blur(); }
      else if (resumed) exitToTizenBrew();
      else if (window.history && window.history.length > 1) window.history.back();
      else exitToTizenBrew();
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    if (pending) { showPicker(); return; }

    // Editing: the D-pad and OK belong to the TV keyboard and the caret.
    if (editing) {
      if (e.keyCode === 13 && submitCustom()) { e.preventDefault(); e.stopPropagation(); }
      return;
    }
    // A highlighted-but-shut URL field is left with the D-pad, so stepping
    // past it works and OK can open the keyboard.
    if (inUrl && e.keyCode === 13) {
      startEditing(active);
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    var dir = ARROWS[e.keyCode];
    if (dir && moveFocus(dir)) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  var wrap = document.getElementById('presets');
  PRESETS.forEach(function (preset) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = preset.flag + '  ' + host(preset.url);
    b.addEventListener('click', function () { save(preset.url); connect(preset.url, false); });
    wrap.appendChild(b);
  });

  document.getElementById('custom').addEventListener('submit', function (e) {
    e.preventDefault();
    submitCustom();
  });

  // A restore from the back/forward cache hands the page back exactly as it was,
  // spinner included, and skips the checks above. Cancel that loader too.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) showPicker();
  });

  // `?instance=` is accepted for programmatic use.
  var requested = null;
  try { requested = new URLSearchParams(location.search).get('instance'); } catch (e) { /* ignore */ }
  var current = saved();
  var forcePick = /[?&]pick(=1)?(&|$)/.test(location.search);

  if (requested) {
    var chosen = normalize(requested);
    if (chosen) { save(chosen); connect(chosen, true); return; }
  }
  // First launch: wait for a choice. Later launches: verify, then connect, and
  // replace this page on the way so Back steps past the loader. Arriving back
  // from an instance always shows the chooser, whatever is saved.
  if (current && !forcePick && !resumed) connect(current, true);
  else showPicker();
})();
</script>
</body>
</html>
